<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rapira Faceit — Топ и подбор</title>
<style>
:root{--panel:#161618;--line:#2a2a2d;--text:#f3f3f3;--muted:#9a9a9f;--o1:#ff9a1f;--o2:#ff5a00;--row:#1b1b1e;--ok:#4cc56f;--bad:#ff5a5a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:repeating-linear-gradient(135deg,#111 0 14px,#0b0b0c 14px 28px);color:var(--text);font-family:"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
.wrap{max-width:900px;margin:0 auto;padding:20px 14px 60px}
h1{margin:0;font-style:italic;font-weight:900;font-size:clamp(34px,9vw,64px);line-height:.95}
h1 .a{background:linear-gradient(#ffb23a,#ff5a00);-webkit-background-clip:text;background-clip:text;color:transparent;display:block}
h1 .b{color:#fff;display:block;text-shadow:0 3px 0 #000}
h2{margin:0 0 10px;font-size:19px}h3{margin:0 0 10px;font-size:16px}
.sub{color:var(--muted);margin:12px 0 14px}.muted{color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
nav{display:flex;gap:6px;margin:14px 0;flex-wrap:wrap}
nav a{color:var(--muted);text-decoration:none;padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-weight:600}
nav a.on{color:#111;background:linear-gradient(#ff9a1f,#ff5a00);border-color:transparent}
nav a:focus-visible,.btn:focus-visible{outline:2px solid var(--o1);outline-offset:2px}
input,select,textarea{width:100%;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:15px;font-family:inherit}
input[type=checkbox]{width:auto;accent-color:var(--o2)}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--o1)}
#q{margin-bottom:12px}
.box{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--o2);border-radius:10px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:460px}
th,td{padding:11px 12px;text-align:left;white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:13px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
th:hover{color:var(--o1)}
tbody tr:nth-child(odd){background:var(--row)}
td.rk{font-weight:800;width:52px;color:var(--muted)}
tr.p1 td.rk{color:#ffc247}tr.p2 td.rk{color:#d6d6d6}tr.p3 td.rk{color:#d98a4b}
td.nm{font-weight:700}td.elo{font-weight:800;color:var(--o1)}
.lvl{display:inline-block;min-width:26px;text-align:center;padding:2px 7px;border-radius:6px;background:linear-gradient(#ff9a1f,#ff5a00);color:#111;font-weight:800;font-size:13px}
.lvl.none{background:var(--line);color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--o2);border-radius:10px;padding:14px;margin-bottom:12px}
.item .hd{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:6px}
.item .hd b{font-size:17px}
.meta{color:var(--muted);font-size:14px;margin:4px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{padding:2px 9px;border-radius:20px;border:1px solid var(--line);font-size:13px;background:var(--row)}
.chip.hit{border-color:var(--o1);color:var(--o1)}
.fit{font-weight:800;font-size:13px;padding:3px 9px;border-radius:6px;background:var(--row);border:1px solid var(--line);white-space:nowrap}
.fit.hi{color:var(--ok);border-color:var(--ok)}.fit.mid{color:var(--o1);border-color:var(--o1)}
.btn{display:inline-block;background:linear-gradient(#ff9a1f,#ff5a00);color:#111;border:0;border-radius:8px;padding:9px 16px;font-weight:800;font-size:14px;cursor:pointer;text-decoration:none;font-family:inherit}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:var(--row);color:var(--text);border:1px solid var(--line);font-weight:600}
.btn.danger{background:none;color:var(--bad);border:1px solid var(--bad);font-weight:600}
.btn.sm{padding:5px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.seg{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.seg button{flex:1;min-width:110px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.form{display:grid;gap:10px}
.form label{display:grid;gap:4px;font-size:14px;color:var(--muted)}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .inl{display:flex;align-items:center;gap:8px;color:var(--text)}
.roles{display:flex;gap:6px;flex-wrap:wrap}
.roles label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;padding:4px 10px;background:var(--row);color:var(--text)}
.mem{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.mem .nm{font-weight:700;flex:1;min-width:120px}
.mem a{color:var(--o1)}
.empty{color:var(--muted);padding:18px;text-align:center}
.ok{color:var(--ok)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222;border:1px solid var(--line);border-left:4px solid var(--ok);padding:10px 16px;border-radius:8px;z-index:50;max-width:92vw}
#toast.err{border-left-color:var(--bad)}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-top:4px solid var(--o2);border-radius:10px;width:min(420px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.6)}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.slot{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;min-height:96px;padding:10px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--o2);border-radius:10px;color:var(--text);font-family:inherit}
.slot.me{border-color:var(--o1)}
.slot.plus{border:2px dashed var(--line);font-size:34px;font-weight:800;color:var(--o1);cursor:pointer}
.slot.plus:hover,.slot.plus:focus-visible{border-color:var(--o1);outline:none}
.slot.free{border-style:dashed;color:var(--muted)}
a.lnk{color:var(--text);text-decoration:none;font-weight:700}a.lnk:hover{color:var(--o1)}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:12px;overflow:hidden;background:linear-gradient(#ff9a1f,#ff5a00);color:#111;font-weight:800;flex:none;border:2px solid var(--line);vertical-align:middle}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.fill{width:100%;aspect-ratio:1/1;font-size:clamp(20px,7vw,34px);border-radius:16px}
.who{display:flex;align-items:center;gap:8px;min-width:0}
.pty-h{display:flex;justify-content:space-between;align-items:baseline;margin:6px 2px 12px;letter-spacing:.12em;font-weight:800;font-size:14px;color:var(--muted)}
.pty-h b{color:var(--text)}
.pty{display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));gap:8px;margin:0 0 14px;padding-top:8px}
.pm{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0;background:none;border:0;color:var(--text);font-family:inherit;padding:0}
.pa{position:relative;width:100%}
.pa>a{display:block}
.pa .av{border-color:#2fd16b}
.pm.me .pa .av{border-color:var(--o1)}
.lead{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:linear-gradient(#ff9a1f,#ff5a00);color:#111;font-size:10px;font-weight:800;padding:2px 7px;border-radius:10px;letter-spacing:.05em;white-space:nowrap;z-index:1}
.pm .pn{font-weight:700;font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pm .pi{font-size:11px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pm .plus{width:100%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;border:2px dashed var(--line);border-radius:16px;font-size:28px;font-weight:800;color:var(--muted)}
button.pm{cursor:pointer}
button.pm:hover .plus,button.pm:focus-visible .plus{border-color:var(--o1);color:var(--o1)}
.pm.wait .av{opacity:.45;border-style:dashed}
.kick{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:1px solid var(--bad);background:#241214;color:var(--bad);font-size:12px;line-height:1;padding:0;cursor:pointer;z-index:2}
.btn.big{display:block;width:100%;padding:15px;font-size:17px;border-radius:14px;margin:4px 0 18px}
.mrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.mrow .mi{flex:1;min-width:0}
.mrow .gid{color:var(--muted);font-size:13px}
[hidden]{display:none!important}
@media(max-width:520px){.form .two,.filters{grid-template-columns:1fr}}
@media(prefers-reduced-motion:no-preference){#toast{animation:pop .2s}@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1><span class="a">RAPIRA</span><span class="b">FACEIT</span></h1>
  </div>
  <p id="boot" class="sub">Загрузка…</p>
  <nav>
    <a href="#top" id="n-top">Топ</a>
    <a href="#find" id="n-find">Подбор</a>
    <a href="#friends" id="n-friends">Друзья</a>
    <a href="#me" id="n-me">Войти</a>
  </nav>

  <section id="t-top">
    <p class="sub">Топ игроков FACEIT — рейтинг по ELO</p>
    <input id="q" type="search" placeholder="Поиск по нику" aria-label="Поиск по нику">
    <div class="box"><table>
      <thead><tr><th data-k="rank">#</th><th data-k="nick">Игрок</th><th data-k="level">Уровень</th><th data-k="elo">ELO</th><th data-k="kd">K/D</th><th data-k="win">Победы</th></tr></thead>
      <tbody id="tb"></tbody>
    </table></div>
  </section>

  <section id="t-find" hidden>
    <p class="sub">Выберите режим, позовите друзей через «+» и нажмите «Найти игру».</p>
    <div id="fl"></div>
  </section>

  <section id="t-friends" hidden></section>

  <section id="t-me" hidden></section>
</div>
<div id="toast" hidden></div>
<script>
(function(){var last="";function show(m){if(m===last)return;last=m;var f=document.getElementById("fatal");if(!f)return;f.hidden=false;f.textContent+=m+"\n"}
  window.addEventListener("error",function(e){if(!e.lineno&&!e.filename&&/^Script error/i.test(e.message||""))return;show("Ошибка: "+(e.message||e)+(e.lineno?" (строка "+e.lineno+")":""))});
  window.addEventListener("unhandledrejection",function(e){var r=e.reason;if(!r)return;show("Ошибка: "+(r.message||r))})})();
</script>
<noscript><p style="padding:20px;color:#fff">Включите JavaScript, чтобы сайт работал.</p></noscript>
<pre id="fatal" hidden style="position:fixed;left:8px;right:8px;bottom:8px;max-height:45vh;overflow:auto;margin:0;padding:10px;background:#300;color:#fff;border:1px solid #f55;border-radius:8px;font-size:12px;white-space:pre-wrap;z-index:100"></pre>

<script>
$=function(s){return document.querySelector(s)};
function h(t,a){var e=document.createElement(t);a=a||{};
  for(var k in a){var v=a[k];
    if(k==="class")e.className=v;else if(k==="text")e.textContent=v;else if(k==="value")e.value=v;
    else if(k.slice(0,2)==="on")e.addEventListener(k.slice(2),v);
    else if(v!==false&&v!=null)e.setAttribute(k,v===true?"":v)}
  for(var i=2;i<arguments.length;i++){var c=arguments[i];if(c==null||c===false)continue;
    if(Array.isArray(c))c.forEach(function(x){if(x)e.appendChild(x)});
    else e.appendChild(typeof c==="object"?c:document.createTextNode(c))}
  return e}
function clear(el){el.textContent=""}

/* ---------- состояние и API ---------- */
var TOKEN=null;try{TOKEN=localStorage.getItem("rf_token")}catch(e){}
var S={me:null,cfg:{roles:[],team_max:5,bot:""},mode:"teams"};
function setToken(t){TOKEN=t;try{t?localStorage.setItem("rf_token",t):localStorage.removeItem("rf_token")}catch(e){}}
function call(path,body){
  var o={headers:{},cache:"no-store"};
  if(TOKEN)o.headers.Authorization="Bearer "+TOKEN;
  if(body!==undefined){o.method="POST";o.headers["Content-Type"]="application/json";o.body=JSON.stringify(body)}
  return fetch(path,o).then(function(r){return r.json().catch(function(){return{}}).then(function(d){
    if(r.status===401&&TOKEN){setToken(null);S.me=null;renderNav()}
    if(!r.ok)throw new Error(d.error||"Ошибка "+r.status);return d})})}
var tt;function toast(msg,err){var t=$("#toast");t.textContent=msg;t.className=err?"err":"";t.hidden=false;clearTimeout(tt);tt=setTimeout(function(){t.hidden=true},3500)}
function act(path,body,ok){return call(path,body).then(function(d){var m=(d&&d.message)||ok;if(m)toast(m);return loadMe().then(function(){route();return d})}).catch(function(e){toast(e.message,true)})}
function loadMe(){return call("/api/me").then(function(d){S.me=d;S.cfg=d.cfg;renderNav()})}
function renderNav(){var u=S.me&&S.me.user,b=(S.me&&S.me.badges)||{};
  $("#n-me").textContent=u?u.nick:"Войти";
  $("#n-find").textContent="Подбор"+(b.party?" ("+b.party+")":"");
  $("#n-friends").textContent="Друзья"+(b.friends?" ("+b.friends+")":"")}
function ask(title,ph){return new Promise(function(res){
  var ta=h("textarea",{maxlength:200,rows:3,placeholder:ph});var d=h("dialog");
  function done(v){d.close();d.remove();res(v)}
  d.appendChild(h("h3",{text:title}));d.appendChild(ta);
  d.appendChild(h("div",{class:"row"},h("button",{class:"btn",text:"Отправить",onclick:function(){done(ta.value)}}),h("button",{class:"btn ghost",text:"Отмена",onclick:function(){done(null)}})));
  d.addEventListener("cancel",function(){d.remove();res(null)});
  document.body.appendChild(d);d.showModal();ta.focus()})}

/* ---------- роутинг ---------- */
var TABS=["top","find","friends","me"];
var CUR=null;
function route(){
  var t=CUR||(location.hash||"#top").slice(1);if(t==="party")t="find";if(TABS.indexOf(t)<0)t="top";CUR=t;
  TABS.forEach(function(n){$("#t-"+n).hidden=n!==t;$("#n-"+n).classList.toggle("on",n===t)});
  var bt=$("#boot");if(bt)bt.hidden=true;window.scrollTo(0,0);
  if(t==="top")loadData();else if(t==="find")renderFind();else if(t==="friends")renderFriends();else renderMe()}
function go(t){CUR=t;try{history.replaceState(null,"","#"+t)}catch(e){}route()}
window.addEventListener("hashchange",function(){CUR=null;route()});
document.addEventListener("click",function(e){
  var a=e.target.closest&&e.target.closest("a[href^='#']");if(!a)return;
  var m=/^#(top|find|friends|me|party)$/.exec(a.getAttribute("href"));
  if(m){e.preventDefault();go(m[1]==="party"?"find":m[1])}});

/* ---------- топ ---------- */
var players=[],sk="rank",dir=1,tb=$("#tb"),q=$("#q");
function cell(tr,text,cls){var td=document.createElement("td");if(cls)td.className=cls;td.textContent=text;tr.appendChild(td);return td}
function renderTop(){
  var t=q.value.trim().toLowerCase();
  var list=players.filter(function(p){return p.nick.toLowerCase().indexOf(t)>-1});
  list.sort(function(a,b){var x=a[sk],y=b[sk];return(x>y?1:x<y?-1:0)*dir});
  tb.textContent="";
  if(!list.length){var r=document.createElement("tr");var td=cell(r,players.length?"Ничего не найдено.":"Таблица пока пуста.");td.colSpan=6;tb.appendChild(r);return}
  list.forEach(function(p){
    var tr=document.createElement("tr");if(p.rank<=3)tr.className="p"+p.rank;
    cell(tr,p.rank,"rk");var nt=cell(tr,"","nm");nt.appendChild(h("span",{class:"who"},av(p,30),h("span",{text:p.nick})));
    var l=cell(tr,"");var s=document.createElement("span");s.className="lvl";s.textContent=p.level;l.appendChild(s);
    cell(tr,p.elo,"elo");cell(tr,Number(p.kd).toFixed(2));cell(tr,p.win+"%");
    tb.appendChild(tr)});
}
function loadData(){fetch("/api/top",{cache:"no-store"}).then(function(r){return r.json()}).then(function(d){players=d;renderTop()}).catch(function(){})}
document.querySelectorAll("th").forEach(function(th){th.addEventListener("click",function(){
  var k=th.dataset.k;if(sk===k){dir=-dir}else{sk=k;dir=(k==="nick"||k==="rank")?1:-1}renderTop()})});
q.addEventListener("input",renderTop);
setInterval(function(){if(!$("#t-top").hidden)loadData()},30000);

/* ---------- аватарки ---------- */
function av(u,sz,cls){
  var d=h("span",{class:"av"+(cls?" "+cls:"")});
  if(sz)d.style.cssText="width:"+sz+"px;height:"+sz+"px;font-size:"+Math.round(sz*.42)+"px";
  var letter=((u&&u.nick)||"?").trim().charAt(0).toUpperCase();
  if(u&&u.av&&u.pid){
    var img=h("img",{src:"/api/avatar/"+u.pid+"?v="+u.av,alt:"",loading:"lazy"});
    img.addEventListener("error",function(){img.remove();d.textContent=letter});
    d.appendChild(img)}
  else d.textContent=letter;
  return d}
function resizeAvatar(f){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(f),img=new Image();
    img.onload=function(){var s=Math.min(img.width,img.height),c=document.createElement("canvas");c.width=c.height=256;
      c.getContext("2d").drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,256,256);URL.revokeObjectURL(url);
      c.toBlob(function(b){b?res(b):rej(new Error("Не удалось обработать фото"))},"image/jpeg",.85)};
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error("Не удалось открыть изображение"))};
    img.src=url})}
function avatarBlock(u){
  var fi=h("input",{type:"file",id:"avfile",accept:"image/*","aria-label":"Выбрать фото из галереи",
    style:"position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none"});
  fi.addEventListener("change",function(){var f=fi.files[0];fi.value="";if(!f)return;
    toast("Загружаю фото…");
    resizeAvatar(f).then(function(b){return fetch("/api/shots/avatar",{method:"POST",headers:{Authorization:"Bearer "+TOKEN,"Content-Type":"image/jpeg"},body:b})})
      .then(function(r){return r.json().catch(function(){return{}}).then(function(d){if(!r.ok)throw new Error(d.error||"Ошибка "+r.status)})})
      .then(function(){toast("Фото обновлено");loadMe().then(route)}).catch(function(e){toast(e.message,true)})});
  return h("div",{class:"who",style:"margin:8px 0 12px;gap:14px;position:relative"},
    h("label",{for:"avfile",style:"cursor:pointer","aria-label":"Сменить фото"},av(u,84)),
    h("div",{},h("div",{class:"row",style:"margin-top:0"},h("label",{for:"avfile",class:"btn sm",text:"Выбрать из галереи"}),
      u.av?h("button",{class:"btn danger sm",type:"button",text:"Удалить",onclick:function(){act("/api/avatar/delete",{},"Фото удалено")}}):null),
      h("p",{class:"muted",style:"margin:6px 0 0",text:"Нажмите на фото или кнопку и выберите снимок из галереи. Он обрежется до квадрата."})),fi)}
var NEEDID=false;
function startSearch(size){
  if(S.me&&S.me.user&&S.me.user.game_id){act("/api/queue/start",{size:size});return}
  NEEDID=true;toast("Сначала укажите ID в игре в профиле",true);go("me")}

/* ---------- общие кусочки ---------- */
function tgLink(u){return u&&/^\w{3,}$/.test(u)?h("a",{href:"https://t.me/"+u,target:"_blank",rel:"noopener",text:"@"+u}):null}
function copyText(t){
  function fb(){return new Promise(function(res,rej){var a=document.createElement("textarea");a.value=t;a.style.cssText="position:fixed;opacity:0";document.body.appendChild(a);a.select();
    var ok=false;try{ok=document.execCommand("copy")}catch(e){}a.remove();ok?res():rej()})}
  try{if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(t).catch(fb)}catch(e){}
  return fb()}
function idRow(gid){
  if(!gid)return h("div",{class:"meta"},"ID в игре не указан. ",h("a",{href:"#me",text:"Добавить в профиле"}));
  return h("div",{class:"meta"},"Ваш ID в игре: ",h("b",{text:gid})," ",
    h("button",{class:"btn ghost sm",type:"button",text:"Копировать",onclick:function(){
      copyText(gid).then(function(){toast("ID скопирован")}).catch(function(){toast("Не удалось скопировать, выделите ID вручную",true)})}}))}
function nickLink(u){return h("a",{href:"#",class:"lnk",text:u.nick,onclick:function(e){e.preventDefault();showProfile(u.pid)}})}
function showProfile(pid){
  call("/api/users/"+encodeURIComponent(pid)).then(function(u){
